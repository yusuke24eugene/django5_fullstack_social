<div class="comment-form-container">
    <form method="POST" action="{% url 'comment_create' post_id=post.id %}" class="space-y-3">
        {% csrf_token %}
        
        <div>
            <label for="comment-content-{{ post.id }}" class="block text-sm font-medium text-gray-700 mb-1">
                Add a comment:
            </label>
            <textarea 
                id="comment-content-{{ post.id }}"
                name="content"
                rows="2"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                placeholder="Write your comment here..."
                required></textarea>
        </div>
        
        <div class="flex justify-end">
            <button 
                type="submit"
                class="px-4 py-2 bg-blue-500 text-white font-medium rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition">
                Post Comment
            </button>
        </div>
    </form>
</div>
